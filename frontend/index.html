<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tran & Wong LLC — Secure Document Upload</title>
  <meta name="description" content="Securely upload documents for review by Tran & Wong LLC's legal department." />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <header class="border-b bg-white">
    <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-slate-900 text-white grid place-items-center text-lg font-bold">TW</div>
        <div>
          <h1 class="text-xl font-semibold">Tran &amp; Wong LLC</h1>
          <p class="text-sm text-slate-500">Secure Client Document Intake</p>
        </div>
      </div>
    </div>
  </header>

  <main id="upload" class="max-w-5xl mx-auto px-4 py-10">
    <div class="grid lg:grid-cols-3 gap-8">
      <section class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-6">
          <h2 class="text-lg font-semibold mb-2">Submit documents for review</h2>
          <p id="timer" class="text-red-600 font-medium mb-4"></p>

          <form id="intakeForm" class="space-y-6">
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1" for="fullName">Full name *</label>
                <input id="fullName" name="fullName" type="text" required class="w-full rounded-xl border-slate-300" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" for="email">Email *</label>
                <input id="email" name="email" type="email" required class="w-full rounded-xl border-slate-300" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" for="phone">Phone *</label>
                <input id="phone" name="phone" type="tel" class="w-full rounded-xl border-slate-300" />
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" for="matterId">Address *</label>
                <input id="matterId" name="matterId" type="text" class="w-full rounded-xl border-slate-300" />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1" for="summary">Brief summary</label>
              <textarea id="summary" name="summary" rows="3" class="w-full rounded-xl border-slate-300"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Files *</label>
              <input id="fileInput" name="files" type="file" multiple class="block" />
            </div>

            <button id="submitBtn" type="submit" class="bg-slate-900 text-white px-4 py-2 rounded-xl">Submit</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Countdown timer
    let timeLeft = 30;
    const timerEl = document.getElementById("timer");
    const form = document.getElementById("intakeForm");

    function updateTimer() {
      timerEl.textContent = "Time Remaining to Submit Documents: " + timeLeft + " seconds";
      if (timeLeft <= 0) {
        redirectToDashboard();
      }
      timeLeft--;
    }

    function redirectToDashboard() {
      // collect form data (excluding file input)
      const params = new URLSearchParams();
      params.set("fullName", form.fullName.value.trim());
      params.set("email", form.email.value.trim());
      params.set("phone", form.phone.value.trim());
      params.set("matterId", form.matterId.value.trim());
      params.set("summary", form.summary.value.trim());

      window.location.href = "dashboard.html?" + params.toString();
    }

    setInterval(updateTimer, 1000);
    updateTimer(); // initial call

    // If user submits before timer ends, redirect immediately
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      redirectToDashboard();
    });
  </script>
</body>
</html>
